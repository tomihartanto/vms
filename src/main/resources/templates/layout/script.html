<script>
    (function ($) {
        "use strict";
        const changeProfileForm = $('#changeProfileForm');
        const changeProfileButton = $('#changeProfileButton');
        $(document).ready(function () {
            changeProfileForm.on('keypress', (e) => {
                if (e.which === 13) {
                    changeProfileButton.trigger('click');
                }
            });

            changeProfileButton.on('click', (e) => {
                e.preventDefault();
                KTApp.block('#kt_quick_user', {
                    overlayColor: '#000000',
                    state: 'danger',
                    message: 'Please wait...'
                });
                axios.post('[[@{/rest/account/update-profile}]]', $('#changeProfileForm').serializeToJSON({}), {}).then((response) => {
                    var data = response.data;
                    if (data.success) {
                        KTApp.unblock('#kt_quick_user');
                        document.location.reload();
                    } else {
                        let option = {
                            title: data.code,
                            messageText: '<p class="mt-2" style="max-height: 200px; overflow-y: auto;">' + data.message + '</p>',
                            icon: 'error'
                        }
                        WebUtil.showErrorMessage($, null, option, $('#kt_quick_user'));
                    }
                }).catch((error) => {
                    const data = error.response.data.data;
                    let option;
                    if (error.response.status === 404) {
                        const imgSrc = '[[@{/media/misc/doh.png}]]';
                        option = {
                            title: "Not Found [404]",
                            messageText: '<img class="img-fluid w-50 mt-2" src="'+ imgSrc + '" alt="">',
                            icon: 'error'
                        };
                    } else {
                        option = {
                            title: data.code,
                            messageText: '<p class="mt-2" style="max-height: 200px; overflow-y: auto;">' + data.message + '</p>',
                            icon: 'error'
                        }
                    }
                    WebUtil.showErrorMessage($, null, option, $('#kt_quick_user'));
                });
            });
        });

        $(window).on('load', function (e) {
        });

    })($);
</script>
